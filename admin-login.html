<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | StreetFault</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Street<span>Fault</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Citizen Login</a>
        </nav>

    </header>


    <section class="auth-section">

        <div class="auth-container">

            <div class="auth-info">

                <p class="section-label">STREETFAULT ADMIN</p>

                <h1>
                    Manage reports.
                    <br>
                    <span>Improve streets.</span>
                </h1>

                <p>
                    Admin dashboard for reviewing citizen
                    complaints and updating their progress.
                </p>

                <div class="auth-points">

                    <div>
                        <strong>01</strong>
                        <span>View citizen complaints</span>
                    </div>

                    <div>
                        <strong>02</strong>
                        <span>Review uploaded images</span>
                    </div>

                    <div>
                        <strong>03</strong>
                        <span>Update complaint status</span>
                    </div>

                </div>

            </div>


            <div class="auth-card">

                <h2>Admin Login</h2>

                <p class="auth-subtitle">
                    Login to manage StreetFault reports
                </p>

                <form id="adminLoginForm">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Admin email"
                        required
                    >

                    <label>Password</label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Admin password"
                        required
                    >

                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Admin Login
                    </button>

                </form>

            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
