<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | StreetFault</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* ===============================
           ADMIN DASHBOARD
           =============================== */

        .admin-page {
            background: #f5f8f7;
            min-height: 100vh;
        }

        .admin-main {
            max-width: 1200px;
            margin: auto;
            padding: 50px 20px;
        }

        .admin-heading {
            margin-bottom: 35px;
        }

        .admin-heading .section-label {
            color: #0b6b50;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 13px;
        }

        .admin-heading h1 {
            font-size: 42px;
            margin: 8px 0;
            color: #12372f;
        }

        .admin-heading p {
            color: #6b7773;
            margin-top: 10px;
        }

        /* ===============================
           STAT CARDS
           =============================== */

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            border: 1px solid #e6eeeb;
        }

        .stat-card span {
            color: #71807b;
            font-size: 14px;
        }

        .stat-card h2 {
            color: #0b6b50;
            font-size: 30px;
            margin: 8px 0 0;
        }

        /* ===============================
           COMPLAINT SECTION
           =============================== */

        .complaints-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .complaints-title h2 {
            color: #12372f;
        }

        .refresh-button {
            border: none;
            background: #0b6b50;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .refresh-button:hover {
            background: #09583f;
        }

        #complaintContainer {
            display: grid;
            gap: 20px;
        }

        /* ===============================
           COMPLAINT CARD
           =============================== */

        .admin-complaint-card {
            background: white;
            border: 1px solid #e3ebe8;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
        }

        .complaint-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            padding-bottom: 18px;
            border-bottom: 1px solid #edf1ef;
        }

        .complaint-header strong {
            color: #0b6b50;
            font-size: 18px;
        }

        .complaint-header p {
            margin: 7px 0 0;
            color: #68756f;
        }

        .status-badge {
            background: #e9f5f0;
            color: #0b6b50;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .complaint-details {
            padding: 20px 0;
        }

        .complaint-details p {
            margin: 10px 0;
            color: #596761;
            line-height: 1.5;
        }

        .complaint-details strong {
            color: #263b35;
        }

        /* ===============================
           ADMIN ACTIONS
           =============================== */

        .admin-actions {
            background: #f7faf9;
            padding: 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .admin-actions label {
            font-weight: 700;
            color: #263b35;
        }

        .status-select {
            border: 1px solid #cbd9d4;
            background: white;
            padding: 10px 14px;
            border-radius: 8px;
            color: #263b35;
            font-size: 14px;
            cursor: pointer;
        }

        .loading-message,
        .empty-message {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            color: #71807b;
        }

        /* ===============================
           MOBILE
           =============================== */

        @media (max-width: 800px) {

            .admin-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .admin-heading h1 {
                font-size: 34px;
            }
        }

        @media (max-width: 550px) {

            .admin-stats {
                grid-template-columns: 1fr;
            }

            .complaint-header {
                flex-direction: column;
            }

            .admin-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .status-select {
                width: 100%;
            }
        }
    </style>
</head>

<body class="admin-page">

    <!-- ===============================
         NAVBAR
         =============================== -->

    <header class="navbar">

        <div class="logo">
            Street<span>Fault</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="report.html">Report Issue</a>
            <a href="track.html">Track Complaint</a>
        </nav>

    </header>


    <!-- ===============================
         ADMIN MAIN
         =============================== -->

    <main class="admin-main">

        <div class="admin-heading">

            <p class="section-label">
                ADMINISTRATION
            </p>

            <h1>
                Complaint Dashboard
            </h1>

            <p>
                Monitor citizen complaints and update their progress.
            </p>

        </div>


        <!-- ===============================
             STATISTICS
             =============================== -->

        <section class="admin-stats">

            <div class="stat-card">
                <span>Total Complaints</span>
                <h2 id="totalCount">0</h2>
            </div>

            <div class="stat-card">
                <span>Pending</span>
                <h2 id="pendingCount">0</h2>
            </div>

            <div class="stat-card">
                <span>In Progress</span>
                <h2 id="progressCount">0</h2>
            </div>

            <div class="stat-card">
                <span>Resolved</span>
                <h2 id="resolvedCount">0</h2>
            </div>

        </section>


        <!-- ===============================
             COMPLAINTS
             =============================== -->

        <section>

            <div class="complaints-title">

                <h2>
                    Citizen Complaints
                </h2>

                <button
                    class="refresh-button"
                    onclick="loadAdminComplaints()">
                    Refresh
                </button>

            </div>


            <!-- IMPORTANT:
                 JavaScript puts MongoDB complaints here
            -->

            <div id="complaintContainer">

                <div class="loading-message">
                    Loading complaints...
                </div>

            </div>

        </section>

    </main>


    <!-- ===============================
         JAVASCRIPT
         =============================== -->

    <script src="script.js"></script>


    <script>

        // ==========================================
        // ADMIN DASHBOARD
        // LOAD COMPLAINTS FROM MONGODB
        // ==========================================

        async function loadAdminComplaints() {

            const container =
                document.getElementById("complaintContainer");

            try {

                container.innerHTML = `
                    <div class="loading-message">
                        Loading complaints...
                    </div>
                `;

                const response = await fetch(
                    "http://127.0.0.1:5000/api/reports/all"
                );

                const data = await response.json();

                if (!response.ok) {

                    container.innerHTML = `
                        <div class="empty-message">
                            Unable to load complaints.
                        </div>
                    `;

                    return;
                }

                const reports = data.reports || [];


                // ==========================================
                // UPDATE STATISTICS
                // ==========================================

                document.getElementById("totalCount").textContent =
                    reports.length;

                document.getElementById("pendingCount").textContent =
                    reports.filter(
                        report => report.status === "Pending"
                    ).length;

                document.getElementById("progressCount").textContent =
                    reports.filter(
                        report => report.status === "In Progress"
                    ).length;

                document.getElementById("resolvedCount").textContent =
                    reports.filter(
                        report => report.status === "Resolved"
                    ).length;


                // ==========================================
                // NO COMPLAINTS
                // ==========================================

                if (reports.length === 0) {

                    container.innerHTML = `
                        <div class="empty-message">
                            No complaints have been submitted yet.
                        </div>
                    `;

                    return;
                }


                // ==========================================
                // CLEAR OLD CONTENT
                // ==========================================

                container.innerHTML = "";


                // ==========================================
                // CREATE COMPLAINT CARDS
                // ==========================================

                reports.forEach(function (report) {

                    const card =
                        document.createElement("div");

                    card.className =
                        "admin-complaint-card";


                    card.innerHTML = `

                        <div class="complaint-header">

                            <div>

                                <strong>
                                    ${report.referenceId}
                                </strong>

                                <p>
                                    ${report.citizenName}
                                </p>

                            </div>

                            <span class="status-badge">
                                ${report.status}
                            </span>

                        </div>


                        <div class="complaint-details">

                            <p>
                                <strong>
                                    Issue:
                                </strong>

                                ${report.issueType}
                            </p>


                            <p>
                                <strong>
                                    Location:
                                </strong>

                                ${report.location}
                            </p>


                            <p>
                                <strong>
                                    Description:
                                </strong>

                                ${report.description}
                            </p>


                            <p>
                                <strong>
                                    Citizen Email:
                                </strong>

                                ${report.citizenEmail}
                            </p>


                            <p>
                                <strong>
                                    Submitted:
                                </strong>

                                ${new Date(
                                    report.createdAt
                                ).toLocaleString()}
                            </p>

                        </div>


                        <div class="admin-actions">

                            <label>
                                Update Status
                            </label>

                            <select
                                class="status-select"
                                onchange="updateComplaintStatus(
                                    '${report.referenceId}',
                                    this.value
                                )"
                            >

                                <option
                                    value="Pending"
                                    ${report.status === "Pending"
                                        ? "selected"
                                        : ""}
                                >
                                    Pending
                                </option>


                                <option
                                    value="In Progress"
                                    ${report.status === "In Progress"
                                        ? "selected"
                                        : ""}
                                >
                                    In Progress
                                </option>


                                <option
                                    value="Resolved"
                                    ${report.status === "Resolved"
                                        ? "selected"
                                        : ""}
                                >
                                    Resolved
                                </option>


                                <option
                                    value="Rejected"
                                    ${report.status === "Rejected"
                                        ? "selected"
                                        : ""}
                                >
                                    Rejected
                                </option>

                            </select>

                        </div>

                    `;


                    container.appendChild(card);

                });

            }

            catch (error) {

                console.error(
                    "ADMIN DASHBOARD ERROR:",
                    error
                );

                container.innerHTML = `
                    <div class="empty-message">
                        Unable to connect to StreetFault server.
                    </div>
                `;

            }

        }


        // ==========================================
        // LOAD WHEN PAGE OPENS
        // ==========================================

        loadAdminComplaints();
        // ==========================================
// UPDATE COMPLAINT STATUS
// ==========================================

async function updateComplaintStatus(referenceId, newStatus) {

    try {

        const response = await fetch(
            "http://127.0.0.1:5000/api/reports/status/" +
            encodeURIComponent(referenceId),
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: newStatus
                })
            }
        );


        const data = await response.json();


        if (response.ok) {

            alert(
                "Complaint status updated to " +
                newStatus
            );

            // Reload dashboard
            loadAdminComplaints();

        } else {

            alert(
                data.message ||
                "Unable to update status."
            );

        }


    } catch (error) {

        console.error(
            "STATUS UPDATE ERROR:",
            error
        );

        alert(
            "Unable to connect to StreetFault server."
        );

    }

}

    </script>

</body>

</html>
