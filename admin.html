
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | StreetFault</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8f7;
            color: #263b35;
        }

        /* ===============================
           NAVBAR
           =============================== */

        .navbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e4ece9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #12372f;
        }

        .logo span {
            color: #15956f;
        }

        .navbar nav {
            display: flex;
            gap: 28px;
        }

        .navbar nav a {
            text-decoration: none;
            color: #53635d;
            font-size: 14px;
            font-weight: 600;
        }

        .navbar nav a:hover {
            color: #0b6b50;
        }

        /* ===============================
           MAIN
           =============================== */

        .admin-main {
            max-width: 1200px;
            margin: auto;
            padding: 50px 20px 70px;
        }

        .admin-heading {
            margin-bottom: 35px;
        }

        .section-label {
            color: #0b6b50;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0 0 8px;
        }

        .admin-heading h1 {
            color: #12372f;
            font-size: 42px;
            margin: 0;
        }

        .admin-heading p:last-child {
            color: #6b7773;
            margin-top: 12px;
        }

        /* ===============================
           STATS
           =============================== */

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 42px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #e3ebe8;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
        }

        .stat-card span {
            display: block;
            color: #71807b;
            font-size: 14px;
        }

        .stat-card h2 {
            color: #0b6b50;
            font-size: 32px;
            margin: 9px 0 0;
        }

        /* ===============================
           COMPLAINT TITLE
           =============================== */

        .complaints-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .complaints-title h2 {
            color: #12372f;
            margin: 0;
        }

        .refresh-button {
            border: none;
            background: #0b6b50;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .refresh-button:hover {
            background: #09583f;
        }

        /* ===============================
           COMPLAINT CONTAINER
           =============================== */

        #complaintContainer {
            display: grid;
            gap: 20px;
        }

        /* ===============================
           COMPLAINT CARD
           =============================== */

        .admin-complaint-card {
            background: white;
            border: 1px solid #e3ebe8;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
        }

        .complaint-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            padding-bottom: 18px;
            border-bottom: 1px solid #edf1ef;
        }

        .reference-id {
            color: #0b6b50;
            font-size: 18px;
            font-weight: 800;
        }

        .citizen-name {
            margin: 7px 0 0;
            color: #68756f;
        }

        .status-badge {
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-pending {
            background: #fff4d6;
            color: #946200;
        }

        .status-progress {
            background: #e6f0ff;
            color: #245ea8;
        }

        .status-resolved {
            background: #e6f7ef;
            color: #087443;
        }

        .status-rejected {
            background: #ffe8e8;
            color: #b42318;
        }

        /* ===============================
           DETAILS
           =============================== */

        .complaint-details {
            padding: 20px 0;
        }

        .complaint-details p {
            margin: 10px 0;
            color: #596761;
            line-height: 1.5;
        }

        .complaint-details strong {
            color: #263b35;
        }

        /* ===============================
           ACTIONS
           =============================== */

        .admin-actions {
            background: #f7faf9;
            padding: 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .admin-actions label {
            font-weight: 700;
            color: #263b35;
        }

        .status-select {
            border: 1px solid #cbd9d4;
            background: white;
            padding: 10px 14px;
            border-radius: 8px;
            color: #263b35;
            font-size: 14px;
            cursor: pointer;
        }

        /* ===============================
           LOADING / EMPTY / ERROR
           =============================== */

        .message-box {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 16px;
            border: 1px solid #e3ebe8;
            color: #71807b;
        }

        .error-box {
            background: #fff4f4;
            color: #b42318;
            border: 1px solid #f0cccc;
        }

        .loading-spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #dce9e4;
            border-top-color: #0b6b50;
            border-radius: 50%;
            margin: 0 auto 12px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===============================
           MOBILE
           =============================== */

        @media (max-width: 800px) {

            .admin-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .admin-heading h1 {
                font-size: 34px;
            }

            .navbar {
                padding: 0 20px;
            }

            .navbar nav {
                gap: 12px;
            }

            .navbar nav a {
                font-size: 12px;
            }
        }

        @media (max-width: 550px) {

            .admin-stats {
                grid-template-columns: 1fr;
            }

            .complaint-header {
                flex-direction: column;
            }

            .admin-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .status-select {
                width: 100%;
            }

            .navbar {
                height: auto;
                padding: 18px 20px;
                flex-direction: column;
                gap: 15px;
            }

            .navbar nav {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>


<body>


    <!-- ===============================
         NAVBAR
         =============================== -->

    <header class="navbar">

        <div class="logo">
            Street<span>Fault</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="report.html">Report Issue</a>
            <a href="track.html">Track Complaint</a>
        </nav>

    </header>


    <!-- ===============================
         MAIN DASHBOARD
         =============================== -->

    <main class="admin-main">


        <!-- HEADER -->

        <div class="admin-heading">

            <p class="section-label">
                ADMINISTRATION
            </p>

            <h1>
                Complaint Dashboard
            </h1>

            <p>
                Monitor citizen complaints and update their progress.
            </p>

        </div>


        <!-- ===============================
             STATISTICS
             =============================== -->

        <section class="admin-stats">

            <div class="stat-card">

                <span>
                    Total Complaints
                </span>

                <h2 id="totalCount">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <span>
                    Pending
                </span>

                <h2 id="pendingCount">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <span>
                    In Progress
                </span>

                <h2 id="progressCount">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <span>
                    Resolved
                </span>

                <h2 id="resolvedCount">
                    0
                </h2>

            </div>

        </section>


        <!-- ===============================
             COMPLAINTS
             =============================== -->

        <section>

            <div class="complaints-title">

                <h2>
                    Citizen Complaints
                </h2>

                <button
                    class="refresh-button"
                    onclick="loadAdminComplaints()">

                    Refresh

                </button>

            </div>


            <div id="complaintContainer">

                <div class="message-box">

                    <div class="loading-spinner"></div>

                    Loading complaints...

                </div>

            </div>

        </section>

    </main>


    <!-- ===============================
         DASHBOARD JAVASCRIPT
         =============================== -->

    <script>

        /* ==========================================
           YOUR LIVE RENDER BACKEND
           ========================================== */

        const API_URL =
            "https://streetfault-backend-9qi4.onrender.com";


        /* ==========================================
           ESCAPE HTML
           ========================================== */

        function escapeHTML(value) {

            return String(value ?? "")

                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* ==========================================
           STATUS CLASS
           ========================================== */

        function getStatusClass(status) {

            if (status === "Pending") {
                return "status-pending";
            }

            if (status === "In Progress") {
                return "status-progress";
            }

            if (status === "Resolved") {
                return "status-resolved";
            }

            if (status === "Rejected") {
                return "status-rejected";
            }

            return "status-pending";

        }


        /* ==========================================
           LOAD COMPLAINTS
           ========================================== */

        async function loadAdminComplaints() {

            const container =
                document.getElementById(
                    "complaintContainer"
                );


            container.innerHTML = `

                <div class="message-box">

                    <div class="loading-spinner"></div>

                    Loading complaints...

                </div>

            `;


            try {

                console.log(
                    "Connecting to:",
                    API_URL + "/api/reports/all"
                );


                /* ==========================================
                   API REQUEST
                   ========================================== */

                const response = await fetch(

                    API_URL + "/api/reports/all",

                    {
                        method: "GET",

                        headers: {
                            "Accept": "application/json"
                        },

                        cache: "no-store"

                    }

                );


                console.log(
                    "Server response:",
                    response.status
                );


                /* ==========================================
                   READ RESPONSE
                   ========================================== */

                const data =
                    await response.json();


                console.log(
                    "API data:",
                    data
                );


                /* ==========================================
                   CHECK SERVER RESPONSE
                   ========================================== */

                if (!response.ok) {

                    throw new Error(

                        data.message ||
                        "Server returned an error."

                    );

                }


                /* ==========================================
                   GET REPORT ARRAY
                   ========================================== */

                let reports = [];


                if (Array.isArray(data)) {

                    reports = data;

                }

                else if (Array.isArray(data.reports)) {

                    reports = data.reports;

                }

                else if (Array.isArray(data.data)) {

                    reports = data.data;

                }


                console.log(
                    "Reports found:",
                    reports.length
                );


                /* ==========================================
                   UPDATE COUNTERS
                   ========================================== */

                document.getElementById(
                    "totalCount"
                ).textContent = reports.length;


                document.getElementById(
                    "pendingCount"
                ).textContent = reports.filter(

                    report =>
                        report.status === "Pending"

                ).length;


                document.getElementById(
                    "progressCount"
                ).textContent = reports.filter(

                    report =>
                        report.status === "In Progress"

                ).length;


                document.getElementById(
                    "resolvedCount"
                ).textContent = reports.filter(

                    report =>
                        report.status === "Resolved"

                ).length;


                /* ==========================================
                   NO COMPLAINTS
                   ========================================== */

                if (reports.length === 0) {

                    container.innerHTML = `

                        <div class="message-box">

                            No complaints have been
                            submitted yet.

                        </div>

                    `;

                    return;

                }


                /* ==========================================
                   CLEAR CONTAINER
                   ========================================== */

                container.innerHTML = "";


                /* ==========================================
                   DISPLAY EACH COMPLAINT
                   ========================================== */

                reports.forEach(function (report) {


                    const card =
                        document.createElement("div");


                    card.className =
                        "admin-complaint-card";


                    const referenceId =
                        escapeHTML(
                            report.referenceId
                        );


                    const citizenName =
                        escapeHTML(
                            report.citizenName ||
                            "Citizen"
                        );


                    const issueType =
                        escapeHTML(
                            report.issueType ||
                            "Not specified"
                        );


                    const location =
                        escapeHTML(
                            report.location ||
                            "Not specified"
                        );


                    const description =
                        escapeHTML(
                            report.description ||
                            "No description"
                        );


                    const citizenEmail =
                        escapeHTML(
                            report.citizenEmail ||
                            "Not available"
                        );


                    const status =
                        report.status ||
                        "Pending";


                    const statusClass =
                        getStatusClass(status);


                    let submittedDate =
                        "Not available";


                    if (report.createdAt) {

                        submittedDate =
                            new Date(
                                report.createdAt
                            ).toLocaleString();

                    }


                    card.innerHTML = `

                        <div class="complaint-header">

                            <div>

                                <div class="reference-id">

                                    ${referenceId}

                                </div>

                                <p class="citizen-name">

                                    ${citizenName}

                                </p>

                            </div>


                            <span
                                class="status-badge ${statusClass}"
                            >

                                ${escapeHTML(status)}

                            </span>

                        </div>


                        <div class="complaint-details">

                            <p>

                                <strong>
                                    Issue:
                                </strong>

                                ${issueType}

                            </p>


                            <p>

                                <strong>
                                    Location:
                                </strong>

                                ${location}

                            </p>


                            <p>

                                <strong>
                                    Description:
                                </strong>

                                ${description}

                            </p>


                            <p>

                                <strong>
                                    Citizen Email:
                                </strong>

                                ${citizenEmail}

                            </p>


                            <p>

                                <strong>
                                    Submitted:
                                </strong>

                                ${escapeHTML(
                                    submittedDate
                                )}

                            </p>

                        </div>


                        <div class="admin-actions">

                            <label>
                                Update Status
                            </label>


                            <select
                                class="status-select"
                                data-reference="${referenceId}"
                            >

                                <option
                                    value="Pending"
                                    ${status === "Pending"
                                        ? "selected"
                                        : ""}
                                >
                                    Pending
                                </option>


                                <option
                                    value="In Progress"
                                    ${status === "In Progress"
                                        ? "selected"
                                        : ""}
                                >
                                    In Progress
                                </option>


                                <option
                                    value="Resolved"
                                    ${status === "Resolved"
                                        ? "selected"
                                        : ""}
                                >
                                    Resolved
                                </option>


                                <option
                                    value="Rejected"
                                    ${status === "Rejected"
                                        ? "selected"
                                        : ""}
                                >
                                    Rejected
                                </option>

                            </select>

                        </div>

                    `;


                    /* ==========================================
                       STATUS CHANGE EVENT
                       ========================================== */

                    const select =
                        card.querySelector(
                            ".status-select"
                        );


                    select.addEventListener(
                        "change",
                        function () {

                            updateComplaintStatus(

                                report.referenceId,

                                this.value

                            );

                        }
                    );


                    container.appendChild(card);

                });

            }


            catch (error) {

                console.error(
                    "ADMIN DASHBOARD ERROR:",
                    error
                );


                container.innerHTML = `

                    <div class="message-box error-box">

                        <strong>
                            Unable to connect to StreetFault server.
                        </strong>

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                        <br><br>

                        <button
                            class="refresh-button"
                            onclick="loadAdminComplaints()"
                        >
                            Try Again
                        </button>

                    </div>

                `;

            }

        }


        /* ==========================================
           UPDATE COMPLAINT STATUS
           ========================================== */

        async function updateComplaintStatus(
            referenceId,
            newStatus
        ) {

            try {

                console.log(
                    "Updating:",
                    referenceId,
                    newStatus
                );


                const response =
                    await fetch(

                        API_URL +
                        "/api/reports/status/" +
                        encodeURIComponent(
                            referenceId
                        ),

                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                status:
                                    newStatus

                            })

                        }

                    );


                const data =
                    await response.json();


                console.log(
                    "Status update response:",
                    data
                );


                if (!response.ok) {

                    throw new Error(

                        data.message ||
                        "Unable to update status."

                    );

                }


                alert(
                    "Complaint status updated to " +
                    newStatus
                );


                /* Reload complaints */

                loadAdminComplaints();

            }


            catch (error) {

                console.error(
                    "STATUS UPDATE ERROR:",
                    error
                );


                alert(
                    "Unable to update complaint status: " +
                    error.message
                );

            }

        }


        /* ==========================================
           START DASHBOARD
           ========================================== */

        window.addEventListener(
            "DOMContentLoaded",
            function () {

                loadAdminComplaints();

            }
        );

    </script>

</body>

</html>
```
