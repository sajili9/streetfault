

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StreetFault Admin Dashboard</title>

    <!-- LEAFLET MAP CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f6;
            color: #263b35;
        }

        /* NAVBAR */

        .navbar {
            background: linear-gradient(135deg, #0b6b50, #15956f);
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #d9fff1;
        }

        .logout-btn {
            background: white;
            color: #0b6b50;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #e9f7f2;
        }

        /* MAIN */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .page-title {
            margin-bottom: 8px;
            color: #0b6b50;
        }

        .page-subtitle {
            color: #66746f;
            margin-bottom: 25px;
        }

        /* SUMMARY */

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            text-align: center;
        }

        .summary-card h2 {
            color: #0b6b50;
            margin-bottom: 5px;
        }

        .summary-card p {
            color: #6d7773;
        }

        /* GPS MAP */

        .map-section {
            background: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .map-section h2 {
            color: #0b6b50;
            margin-bottom: 8px;
        }

        .map-section p {
            color: #66746f;
            margin-bottom: 15px;
        }

        #complaintMap {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            border: 1px solid #e3ebe8;
            z-index: 1;
        }

        #mapMessage {
            margin-top: 12px;
            font-size: 14px;
            color: #66746f;
        }

        /* COMPLAINT CARD */

        .complaint-card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .complaint-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .reference {
            font-size: 18px;
            font-weight: bold;
            color: #0b6b50;
        }

        /* STATUS */

        .status {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .status-pending {
            background: #fff4cc;
            color: #8a6d00;
        }

        .status-progress {
            background: #dceeff;
            color: #1769aa;
        }

        .status-resolved {
            background: #dff7e9;
            color: #167345;
        }

        .status-rejected {
            background: #ffe1e1;
            color: #b42318;
        }

        /* DETAILS */

        .complaint-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail {
            background: #f7faf9;
            padding: 13px;
            border-radius: 8px;
        }

        .detail strong {
            display: block;
            margin-bottom: 5px;
            color: #263b35;
        }

        .detail span {
            color: #596761;
            overflow-wrap: anywhere;
        }

        .description {
            grid-column: 1 / -1;
        }

        /* IMAGE */

        .complaint-image {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #edf1ef;
        }

        .complaint-image strong {
            display: block;
            margin-bottom: 10px;
            color: #263b35;
        }

        .complaint-image img {
            display: block;
            width: 100%;
            max-width: 500px;
            max-height: 350px;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid #e3ebe8;
            background: #f5f8f7;
        }

        /* LOCATION BUTTON */

        .map-btn {
            margin-top: 12px;
            padding: 10px 16px;
            border: 1px solid #15956f;
            border-radius: 8px;
            background: white;
            color: #0b6b50;
            cursor: pointer;
            font-weight: bold;
        }

        .map-btn:hover {
            background: #e9f7f2;
        }

        .no-gps {
            color: #8a6d00;
            font-size: 14px;
        }

        /* ADMIN ACTIONS */

        .admin-actions {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #edf1ef;
        }

        .admin-actions label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .status-select {
            width: 100%;
            max-width: 300px;
            padding: 11px;
            border: 1px solid #cfdad6;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        .update-btn {
            margin-top: 12px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #0b6b50;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .update-btn:hover {
            background: #085a43;
        }

        /* MESSAGE */

        .message {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            color: #697670;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        /* RESPONSIVE */

        @media (max-width: 800px) {

            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .complaint-details {
                grid-template-columns: 1fr;
            }

            .description {
                grid-column: auto;
            }

        }

        @media (max-width: 500px) {

            .summary {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 15px 5%;
            }

            .container {
                width: 94%;
            }

            .complaint-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            #complaintMap {
                height: 320px;
            }

        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            Street<span>Fault</span>
        </div>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </header>


    <!-- MAIN -->

    <main class="container">

        <h1 class="page-title">
            Admin Dashboard
        </h1>

        <p class="page-subtitle">
            View and manage citizen complaints submitted through StreetFault.
        </p>


        <!-- SUMMARY -->

        <div class="summary">

            <div class="summary-card">
                <h2 id="totalReports">0</h2>
                <p>Total Reports</p>
            </div>

            <div class="summary-card">
                <h2 id="pendingReports">0</h2>
                <p>Pending</p>
            </div>

            <div class="summary-card">
                <h2 id="progressReports">0</h2>
                <p>In Progress</p>
            </div>

            <div class="summary-card">
                <h2 id="resolvedReports">0</h2>
                <p>Resolved</p>
            </div>

        </div>


        <!-- GPS MAP -->

        <section class="map-section">

            <h2>📍 Complaint Locations</h2>

            <p>
                View the GPS locations of citizen complaints on the map.
            </p>

            <div id="complaintMap"></div>

            <div id="mapMessage" aria-live="polite">
                Loading complaint locations...
            </div>

        </section>


        <!-- COMPLAINTS -->

        <div id="complaintsContainer">

            <div class="message">
                Loading complaints...
            </div>

        </div>

    </main>


    <!-- LEAFLET MAP JAVASCRIPT -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script>

        /* =========================
           BACKEND URL
        ========================= */

        const API_URL =
            "https://streetfault-backend-9qi4.onrender.com";


        /* =========================
           INITIALIZE MAP
        ========================= */

        let complaintMap = null;

        let mapMarkers = {};

        function initializeMap() {

            complaintMap = L.map("complaintMap").setView(
                [20.5937, 78.9629],
                5
            );

            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    attribution:
                        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }
            ).addTo(complaintMap);

        }


        /* =========================
           DISPLAY GPS LOCATIONS
        ========================= */

        function displayComplaintLocations(reports) {

            const mapMessage =
                document.getElementById("mapMessage");

            Object.values(mapMarkers).forEach(marker => {
                complaintMap.removeLayer(marker);
            });

            mapMarkers = {};

            const validReports = reports.filter(report => {

                const lat = Number(report.latitude);
                const lng = Number(report.longitude);

                return (
                    report.latitude !== null &&
                    report.latitude !== undefined &&
                    report.longitude !== null &&
                    report.longitude !== undefined &&
                    report.latitude !== "" &&
                    report.longitude !== "" &&
                    Number.isFinite(lat) &&
                    Number.isFinite(lng) &&
                    lat >= -90 &&
                    lat <= 90 &&
                    lng >= -180 &&
                    lng <= 180
                );

            });

            if (validReports.length === 0) {

                mapMessage.textContent =
                    "No GPS locations available yet. New complaints with captured GPS coordinates will appear here.";

                return;

            }

            const bounds = [];

            validReports.forEach(report => {

                const lat = Number(report.latitude);
                const lng = Number(report.longitude);

                const marker = L.marker([lat, lng])
                    .addTo(complaintMap);

                const popupContent = `

                    <div style="min-width:180px;">

                        <strong>
                            ${escapeHTML(report.referenceId)}
                        </strong>

                        <br><br>

                        <b>Issue:</b>
                        ${escapeHTML(report.issueType)}

                        <br>

                        <b>Citizen:</b>
                        ${escapeHTML(report.citizenName)}

                        <br>

                        <b>Location:</b>
                        ${escapeHTML(report.location)}

                        <br>

                        <b>Status:</b>
                        ${escapeHTML(report.status)}

                    </div>

                `;

                marker.bindPopup(popupContent);

                mapMarkers[report.referenceId] = marker;

                bounds.push([lat, lng]);

            });

            if (bounds.length === 1) {

                complaintMap.setView(bounds[0], 15);

            } else {

                complaintMap.fitBounds(bounds, {
                    padding: [40, 40],
                    maxZoom: 15
                });

            }

            mapMessage.textContent =
                validReports.length +
                " complaint location(s) displayed on the map.";

        }


        /* =========================
           VIEW LOCATION ON MAP
        ========================= */

        function focusOnLocation(referenceId) {

            const marker =
                mapMarkers[referenceId];

            if (!marker) {

                alert("GPS location is not available for this complaint.");

                return;

            }

            complaintMap.setView(
                marker.getLatLng(),
                16
            );

            marker.openPopup();

            document.getElementById("complaintMap")
                .scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

        }


        /* =========================
           LOAD COMPLAINTS
        ========================= */

        async function loadComplaints() {

            const container =
                document.getElementById("complaintsContainer");

            try {

                const response = await fetch(
                    API_URL + "/api/reports/all"
                );

                if (!response.ok) {

                    throw new Error(
                        "Server returned status " + response.status
                    );

                }

                const result = await response.json();

                let reports = [];

                if (Array.isArray(result)) {

                    reports = result;

                } else if (
                    result.reports &&
                    Array.isArray(result.reports)
                ) {

                    reports = result.reports;

                } else if (
                    result.data &&
                    Array.isArray(result.data)
                ) {

                    reports = result.data;

                } else if (
                    result.results &&
                    Array.isArray(result.results)
                ) {

                    reports = result.results;

                } else {

                    throw new Error(
                        "Could not find reports in server response"
                    );

                }


                /* SUMMARY */

                document.getElementById(
                    "totalReports"
                ).textContent = reports.length;

                const pending = reports.filter(
                    report => report.status === "Pending"
                ).length;

                const progress = reports.filter(
                    report => report.status === "In Progress"
                ).length;

                const resolved = reports.filter(
                    report => report.status === "Resolved"
                ).length;

                document.getElementById(
                    "pendingReports"
                ).textContent = pending;

                document.getElementById(
                    "progressReports"
                ).textContent = progress;

                document.getElementById(
                    "resolvedReports"
                ).textContent = resolved;


                /* UPDATE MAP */

                displayComplaintLocations(reports);


                /* NO REPORTS */

                if (reports.length === 0) {

                    container.innerHTML = `
                        <div class="message">
                            No complaints have been submitted yet.
                        </div>
                    `;

                    return;

                }


                /* CREATE COMPLAINT CARDS */

                container.innerHTML = "";

                reports.slice().reverse().forEach(report => {

                    const card =
                        document.createElement("div");

                    card.className = "complaint-card";

                    const status =
                        report.status || "Pending";

                    const statusClass =
                        getStatusClass(status);


                    /* IMAGE */

                    let imageHTML = "";

                    if (
                        report.image &&
                        typeof report.image === "string" &&
                        report.image.trim() !== ""
                    ) {

                        imageHTML = `

                            <div class="complaint-image">

                                <strong>Uploaded Image:</strong>

                                <img
                                    src="${escapeHTML(report.image)}"
                                    alt="Complaint image"
                                    loading="lazy"
                                >

                            </div>

                        `;

                    }


                    /* GPS DETAILS */

                    let gpsHTML = "";

                    const hasGPS =
                        report.latitude !== null &&
                        report.latitude !== undefined &&
                        report.longitude !== null &&
                        report.longitude !== undefined &&
                        report.latitude !== "" &&
                        report.longitude !== "" &&
                        Number.isFinite(Number(report.latitude)) &&
                        Number.isFinite(Number(report.longitude)) &&
                        Number(report.latitude) >= -90 &&
                        Number(report.latitude) <= 90 &&
                        Number(report.longitude) >= -180 &&
                        Number(report.longitude) <= 180;

                    if (hasGPS) {

                        gpsHTML = `

                            <div class="detail">

                                <strong>GPS Coordinates</strong>

                                <span>
                                    ${Number(report.latitude).toFixed(6)},
                                    ${Number(report.longitude).toFixed(6)}
                                </span>

                                <br>

                                <button
                                    class="map-btn"
                                    type="button"
                                    data-map-reference="${escapeHTML(report.referenceId)}"
                                >
                                    📍 View on Map
                                </button>

                            </div>

                        `;

                    } else {

                        gpsHTML = `

                            <div class="detail">

                                <strong>GPS Location</strong>

                                <span class="no-gps">
                                    Location unavailable
                                </span>

                            </div>

                        `;

                    }


                    /* CARD */

                    card.innerHTML = `

                        <div class="complaint-header">

                            <div class="reference">
                                ${escapeHTML(report.referenceId || "No Reference ID")}
                            </div>

                            <span class="status ${statusClass}">
                                ${escapeHTML(status)}
                            </span>

                        </div>


                        <div class="complaint-details">

                            <div class="detail">
                                <strong>Citizen Name</strong>
                                <span>
                                    ${escapeHTML(report.citizenName || "Not provided")}
                                </span>
                            </div>

                            <div class="detail">
                                <strong>Email</strong>
                                <span>
                                    ${escapeHTML(report.citizenEmail || "Not provided")}
                                </span>
                            </div>

                            <div class="detail">
                                <strong>Issue Type</strong>
                                <span>
                                    ${escapeHTML(report.issueType || "Not provided")}
                                </span>
                            </div>

                            <div class="detail">
                                <strong>Location</strong>
                                <span>
                                    ${escapeHTML(report.location || "Not provided")}
                                </span>
                            </div>

                            ${gpsHTML}

                            <div class="detail description">
                                <strong>Description</strong>
                                <span>
                                    ${escapeHTML(report.description || "No description")}
                                </span>
                            </div>

                        </div>

                        ${imageHTML}

                        <div class="admin-actions">

                            <label>
                                Update Complaint Status
                            </label>

                            <select
                                class="status-select"
                                id="status-${escapeHTML(report.referenceId)}"
                            >

                                <option value="Pending"
                                    ${status === "Pending" ? "selected" : ""}>
                                    Pending
                                </option>

                                <option value="In Progress"
                                    ${status === "In Progress" ? "selected" : ""}>
                                    In Progress
                                </option>

                                <option value="Resolved"
                                    ${status === "Resolved" ? "selected" : ""}>
                                    Resolved
                                </option>

                                <option value="Rejected"
                                    ${status === "Rejected" ? "selected" : ""}>
                                    Rejected
                                </option>

                            </select>

                            <br>

                            <button
                                class="update-btn"
                                type="button"
                                data-update-reference="${escapeHTML(report.referenceId)}"
                            >
                                Update Status
                            </button>

                        </div>

                    `;

                    container.appendChild(card);

                });


                /* CONNECT BUTTONS */

                container.querySelectorAll("[data-map-reference]")
                    .forEach(button => {

                        button.addEventListener("click", function () {

                            focusOnLocation(
                                this.dataset.mapReference
                            );

                        });

                    });

                container.querySelectorAll("[data-update-reference]")
                    .forEach(button => {

                        button.addEventListener("click", function () {

                            updateStatus(
                                this.dataset.updateReference
                            );

                        });

                    });

            }

            catch (error) {

                console.error(
                    "Error loading complaints:",
                    error
                );

                container.innerHTML = `

                    <div class="message">

                        Unable to load complaints.

                        <br><br>

                        <small>
                            ${escapeHTML(error.message)}
                        </small>

                    </div>

                `;

            }

        }


        /* =========================
           STATUS CLASS
        ========================= */

        function getStatusClass(status) {

            if (status === "In Progress") {
                return "status-progress";
            }

            if (status === "Resolved") {
                return "status-resolved";
            }

            if (status === "Rejected") {
                return "status-rejected";
            }

            return "status-pending";

        }


        /* =========================
           UPDATE STATUS
        ========================= */

        async function updateStatus(referenceId) {

            const select =
                document.getElementById("status-" + referenceId);

            if (!select) {

                alert("Status selector not found.");

                return;

            }

            const newStatus = select.value;

            try {

                const response = await fetch(

                    API_URL +
                    "/api/reports/status/" +
                    encodeURIComponent(referenceId),

                    {

                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            status: newStatus
                        })

                    }

                );

                const result = await response.json();

                if (!response.ok) {

                    alert(
                        result.message ||
                        "Unable to update status"
                    );

                    return;

                }

                alert(
                    "Complaint status updated successfully!"
                );

                loadComplaints();

            }

            catch (error) {

                console.error(
                    "STATUS UPDATE ERROR:",
                    error
                );

                alert(
                    "Unable to connect to StreetFault server."
                );

            }

        }


        /* =========================
           LOGOUT
        ========================= */

        function logout() {

            localStorage.removeItem("streetfaultAdmin");
            localStorage.removeItem("adminLoggedIn");

            window.location.href = "admin-login.html";

        }


        /* =========================
           HTML ESCAPE
        ========================= */

        function escapeHTML(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================
           START DASHBOARD
        ========================= */

        initializeMap();

        loadComplaints();

    </script>

</body>
</html>
